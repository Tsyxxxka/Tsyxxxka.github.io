{% include base_path %}
{% assign author = site.author %}
<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
  <img
    src="{{ '/images/photo.jpg' | relative_url }}"
    alt="Siyi Teng"
    class="siyi-avatar"
  >
</div>
  <div class="author__content">
    <h3 class="author__name">{{ author.name }}</h3>
    <p class="author__bio">{{ author.bio }}</p>
  </div>
  <div class="author__urls-wrapper">
    <button class="btn btn--inverse" type="button">Links</button>
    <ul class="author__urls social-icons">
      <li><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i> {{ author.location }}</li>
      <li><a href="mailto:{{ author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>
      <li><a href="{{ author.dblp }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-fw ai-dblp-square" aria-hidden="true"></i> dblp</a></li>
      <li><a href="{{ author.orcid }}" target="_blank" rel="noopener noreferrer"><i class="ai ai-fw ai-orcid" aria-hidden="true"></i> ORCID</a></li>
      <li><a href="https://github.com/{{ author.github }}" target="_blank" rel="noopener noreferrer"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
    </ul>
  </div>
</div>
